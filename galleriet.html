     <style>
        
        /* Container that holds the images */
        .image-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(125px, 1fr)); 
        gap: 20px; /* Spacing between rows and columns */
        }

        /* Styling for each image box */
        .image-box {
        width: auto;       /* Makes image fill its specific grid cell */
        height: auto;     /* Sets a uniform height for all rows */
        object-fit: cover; /* Crops the image neatly inside the uniform box */     /* Gives each image equal width */
        }

        

        /* Mobile Responsive View */
        @media (max-width: 600px) {
            .image-row {
                flex-direction: column; /* Stack vertically on small screens */
            }
        }
    </style>

    

</head>
